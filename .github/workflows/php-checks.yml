name: PHP Syntax, Registration and Auth Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl, gd
          coverage: none
      - name: Check PHP syntax
        run: find frontend backend -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Check browser JavaScript syntax
        run: find frontend/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Validate Phase 2 server-side rules
        run: php backend/tests/phase2_rules_test.php
      - name: Validate billing money, payment and due-date rules
        run: php backend/tests/billing_rules_test.php
      - name: Validate Gmail mailer configuration and safe diagnostics
        run: php backend/tests/mail_transport_test.php
      - name: Validate seeded login lockouts and security thresholds
        run: php backend/tests/auth_rules_test.php
      - name: Validate Phase 4.1 recovery entry and CAPTCHA rules
        run: php backend/tests/recovery_entry_rules_test.php
      - name: Validate Phase 4.2 security-question and answer rules
        run: php backend/tests/recovery_question_rules_test.php


  billing-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: billing_ci_test_only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pbilling_ci_test_only"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - name: Validate real MySQL billing transactions and account isolation
        env:
          BG_TEST_DB_HOST: 127.0.0.1
          BG_TEST_DB_PASS: billing_ci_test_only
        run: php backend/tests/billing_integration_test.php
      - name: Validate Phase 3 login OTP lockouts alerts and IP blocking in MySQL
        env:
          BG_TEST_DB_PASS: billing_ci_test_only
          BG_AUTH_INTEGRATION_CI: yes
        run: php backend/tests/auth_integration_test.php
      - name: Validate Phase 4.1 account recovery entry with isolated MySQL
        env:
          BG_TEST_DB_PASS: billing_ci_test_only
          BG_RECOVERY_ENTRY_CI: yes
        run: php backend/tests/recovery_entry_integration_test.php
      - name: Validate Phase 4.2 account question verification and shared lockouts
        env:
          BG_TEST_DB_PASS: billing_ci_test_only
          BG_RECOVERY_QUESTION_CI: yes
        run: php backend/tests/recovery_question_integration_test.php
